
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev

      - name: Prepare Python environment
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: Extract Android source
        run: |
          unzip -q android-source.zip -d android-source
          SPEC=$(find android-source -name buildozer.spec -print -quit)
          if [ -z "$SPEC" ]; then
            echo "buildozer.spec bulunamadi"
            exit 1
          fi
          echo "APP_DIR=$(dirname "$SPEC")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          source .venv/bin/activate
          cd "$APP_DIR"
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web-intelligence-android-apk
          path: android-source/**/bin/*.apk
          if-no-files-found: error
